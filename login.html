<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sign in to JobFromHome to find verified remote internships and work-from-home roles.">
  <title>Sign in | JobFromHome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="brand" href="index.html">Job<span>FromHome</span></a>
    <section class="auth-card">
      <p class="eyebrow">Secure sign in</p>
      <h1>Find real remote opportunities.</h1>
      <p class="auth-copy">Candidates apply free. Employers can create verified company workspaces.</p>
      <form id="magicLinkForm" novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <button id="sendLinkButton" class="button button-primary button-full" type="submit">Email me a sign-in link</button>
        <p id="loginMessage" class="form-message" aria-live="polite"></p>
      </form>
      <div class="auth-divider"><span>or</span></div>
      <button id="googleButton" class="button button-secondary button-full" type="button">Continue with Google</button>
      <p class="auth-note">By continuing, you agree to our <a href="terms.html">Terms</a>, <a href="privacy.html">Privacy Policy</a>, and <a href="safety.html">Safety Rules</a>.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
